name: Deploy Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prisma Generate
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Create deployment zip
        run: |
          zip -r release.zip . \
           -x "node_modules/*" \
              ".git/*" \
               ".github/*" \
               ".coderabbit.yaml" \
               ".vscode/*" \
               ".env" \

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp release.zip s3://${{ secrets.S3_BUCKET }}/releases/${{ github.sha }}-${{ github.run_id }}.zip

      - name: Deploy to CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODE_DEPLOY_APPLICATION_NAME }} \
            --deployment-group-name ${{ secrets.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }} \
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=releases/${{ github.sha }}-${{ github.run_id }}.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE
