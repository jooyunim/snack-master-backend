name: Deploy Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Verify node_modules
        run: |
          echo "=== NODE_MODULES SIZE ==="
          du -sh node_modules
          echo "=== CHECK IMPORTANT PACKAGES ==="
          npm ls --depth=0

      - name: Create deployment zip
        run: |
          # -y: .bin 심볼릭 링크를 파일 복사 대신 링크로 저장
          # (그렇지 않으면 prisma CLI가 .bin에서 wasm을 찾다 ENOENT)
          zip -ry release.zip . \
           -x  ".git/*" \
               ".github/*" \
               ".coderabbit.yaml" \
               ".vscode/*" \
               ".env"

      - name: Verify deployment zip
        run: |
          echo "=== ZIP SIZE ==="
          ls -lh release.zip
          echo "=== CHECK node_modules IN ZIP ==="
          unzip -l release.zip | grep "node_modules/" | head
          echo "=== CHECK PRISMA SYMLINK / WASM ==="
          unzip -l release.zip | grep -E 'node_modules/\.bin/prisma$|prisma_schema_build_bg\.wasm' | head

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp release.zip s3://${{ secrets.S3_BUCKET }}/releases/${{ github.sha }}-${{ github.run_id }}.zip

      - name: Deploy to CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODE_DEPLOY_APPLICATION_NAME }} \
            --deployment-group-name ${{ secrets.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }} \
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=releases/${{ github.sha }}-${{ github.run_id }}.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE
